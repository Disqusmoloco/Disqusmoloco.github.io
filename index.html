<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moloco</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

html {
    background: #080808;
}

body {
    background: #080808;
    color: #d7d7d7;
    font-family: Arial, Helvetica, sans-serif;
}

a {
    color: #bdbdbd;
}


/* =====================================================
   MOLOCO HEADER
===================================================== */

.site-header {
    height: 96px;

    display: flex;
    align-items: flex-start;

    padding: 24px 20px 0;

    background: #080808;

    border-bottom: 1px solid #202020;
}

.site-title {
    margin: 0;

    color: #9b9b9b;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 26px;
    font-weight: normal;

    line-height: 1;

    letter-spacing: 1px;
}


/* =====================================================
   PAGE
===================================================== */

.page-shell {
    width: 100%;
    min-height: 900px;

    background: #080808;
}

.main-content {
    width: 100%;

    margin: 0 auto;

    padding: 22px 0 0;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome-image {
    width: 800px;
    max-width: calc(100% - 40px);

    margin: 0 auto 14px;

    text-align: center;
}

.welcome-image img {
    display: block;

    width: 320px;
    max-width: 80%;

    height: auto;

    margin: 0 auto;

    object-fit: contain;
}


/* =====================================================
   HOME
===================================================== */

.main-nav {
    display: flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 10px;
}

.main-nav a {
    color: #b7b7b7;

    text-decoration: none;

    text-transform: uppercase;

    font-size: 11px;

    letter-spacing: 2px;
}


/* =====================================================
   MAIN CHATROOM
===================================================== */

.room-header {
    width: 760px;
    max-width: calc(100% - 40px);

    margin: 0 auto 18px;

    text-align: center;
}

.room-header h2 {
    margin: 0;

    color: #dedede;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 21px;
    font-weight: normal;

    line-height: 1.1;

    letter-spacing: 3px;
}


/* =====================================================
   BEACH IMAGE
===================================================== */

.chatroom-image {
    width: 760px;
    max-width: calc(100% - 40px);

    /*
       No bottom margin.

       This makes the underwater section begin
       immediately after the beach image.
    */

    margin: 0 auto;

    text-align: center;
}

.chatroom-image img {
    display: block;

    width: 100%;
    height: auto;

    margin: 0 auto;
}


/* =====================================================
   UNDERWATER AREA

   The underwater image begins EXACTLY where
   the Disqus section begins.

   We use the ORIGINAL ocean image and move it
   upward so the darker middle/deeper section
   appears instead of the bright surface.
===================================================== */

.discussion-area {
    width: 100%;

    min-height: 1200px;

    /*
       ZERO top padding is intentional.
       The Disqus box starts exactly where
       the underwater background starts.
    */

    padding: 0 20px 140px;

    background-color: #020b12;

    background-image: url("ocean.png");

    /*
       Don't use cover.

       This helps prevent unnecessary enlargement
       and preserves more of the original quality.
    */

    background-size: 100% auto;

    /*
       Move the image upward.

       This skips the brightest surface section
       and shows the darker halfway portion.
    */

    background-position: center -230px;

    background-repeat: no-repeat;
}


/* =====================================================
   DISQUS
===================================================== */

.disqus-shell {
    width: 760px;
    max-width: 100%;

    margin: 0 auto;

    padding: 22px 26px 30px;

    background: #0b0b0b;

    border: 1px solid #262626;

    border-radius: 3px;
}

#disqus_thread {
    width: 100%;

    color-scheme: dark;
}


/*
   There is intentionally NO custom username
   coloring here.

   This allows Disqus to use its normal
   username/link colors.
*/


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 850px) {

    .site-header {
        height: 78px;

        padding: 20px 15px 0;
    }

    .site-title {
        font-size: 23px;
    }

    .main-content {
        padding-top: 20px;
    }

    .welcome-image {
        max-width: calc(100% - 30px);
    }

    .welcome-image img {
        width: 280px;
    }

    .room-header {
        max-width: calc(100% - 30px);
    }

    .room-header h2 {
        font-size: 19px;
    }

    .chatroom-image {
        max-width: calc(100% - 30px);
    }

    .discussion-area {
        padding-left: 15px;
        padding-right: 15px;
        padding-bottom: 120px;

        background-position: center -180px;
    }

    .disqus-shell {
        padding: 18px 18px 24px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 550px) {

    .site-header {
        height: 66px;

        padding: 17px 12px 0;
    }

    .site-title {
        font-size: 20px;

        letter-spacing: .5px;
    }

    .main-content {
        padding-top: 18px;
    }


    /* WELCOME */

    .welcome-image {
        max-width: calc(100% - 20px);

        margin-bottom: 12px;
    }

    .welcome-image img {
        width: 230px;

        max-width: 85%;
    }


    /* HOME */

    .main-nav {
        margin-bottom: 8px;
    }

    .main-nav a {
        font-size: 10px;
    }


    /* MAIN CHATROOM */

    .room-header {
        max-width: calc(100% - 20px);

        margin-bottom: 14px;
    }

    .room-header h2 {
        font-size: 17px;

        letter-spacing: 2px;
    }


    /* BEACH */

    .chatroom-image {
        max-width: calc(100% - 20px);

        margin-bottom: 0;
    }


    /* UNDERWATER */

    .discussion-area {
        min-height: 900px;

        padding: 0 10px 100px;

        /*
           On phones we preserve the proportions
           without stretching the image across
           an enormous desktop width.
        */

        background-size: auto 700px;

        background-position: center -135px;

        background-repeat: no-repeat;
    }


    /* DISQUS */

    .disqus-shell {
        padding: 14px 12px 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     MOLOCO
===================================================== -->

<header class="site-header">

    <h1 class="site-title">
        Moloco.
    </h1>

</header>



<!-- =====================================================
     PAGE
===================================================== -->

<div class="page-shell">


<main class="main-content">



    <!-- =================================================
         WELCOME
    ================================================== -->

    <div class="welcome-image">

        <img
            src="welcome-new.png"
            alt="Welcome"
        >

    </div>



    <!-- =================================================
         HOME
    ================================================== -->

    <nav class="main-nav">

        <a href="https://disqusmoloco.github.io/">
            HOME
        </a>

    </nav>



    <!-- =================================================
         MAIN CHATROOM
    ================================================== -->

    <section class="room-header">

        <h2>
            ≠ MAIN CHATROOM ≠
        </h2>

    </section>



    <!-- =================================================
         BEACH IMAGE
    ================================================== -->

    <div class="chatroom-image">

        <img
            src="beach.png"
            alt=""
        >

    </div>



    <!-- =================================================
         UNDERWATER + DISQUS

         The underwater background begins
         EXACTLY HERE.
    ================================================== -->

    <section class="discussion-area">


        <div class="disqus-shell">


            <div id="disqus_thread"></div>


            <script>

                /*
                 * MAIN CHATROOM
                 */

                var disqus_config = function () {


                    this.page.identifier =
                        'main-chatroom';


                    this.page.title =
                        'Main Chatroom';


                    this.page.url =
                        'https://disqusmoloco.github.io/';


                };


                /*
                 * LOAD DISQUS
                 */

                (function () {


                    var d = document;


                    var s =
                        d.createElement('script');


                    s.src =
                        'https://disqusmoloco.disqus.com/embed.js';


                    s.setAttribute(
                        'data-timestamp',
                        +new Date()
                    );


                    (d.head || d.body)
                        .appendChild(s);


                })();


            </script>


            <noscript>

                Please enable JavaScript to view
                the comments powered by Disqus.

            </noscript>


        </div>


    </section>


</main>


</div>


</body>

</html>
