<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moloco · The Apiary</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

html {
    background: #080808;
}

body {
    background: #080808;
    color: #d7d2cb;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;
    width: 100%;
    height: 285px;
    overflow: hidden;
    background: #050505;
    border-bottom: 1px solid #76531e;
}

.hero-left,
.hero-right {
    position: absolute;
    top: 0;
    bottom: 0;

    background-repeat: no-repeat;
    background-size: cover;
}

.hero-left {
    left: 0;
    width: 52%;

    background-image: url("beehive.jpg");
    background-position: center 48%;
}

.hero-right {
    right: 0;
    width: 56%;

    background-image: url("field.png");
    background-position: center 48%;
}


/* Dark blend between the two images */

.hero::before {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,0) 30%,
            rgba(0,0,0,.15) 36%,
            rgba(0,0,0,.48) 42%,
            rgba(0,0,0,.86) 47%,
            rgba(0,0,0,.94) 50%,
            rgba(0,0,0,.86) 53%,
            rgba(0,0,0,.48) 58%,
            rgba(0,0,0,.15) 64%,
            rgba(0,0,0,0) 70%,
            rgba(0,0,0,0) 100%
        );
}


/* Slight cinematic darkening toward bottom */

.hero::after {
    content: "";

    position: absolute;
    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            transparent 55%,
            rgba(0,0,0,.26)
        );
}


/* =========================================================
   HERO CENTER
========================================================= */

.hero-center {
    position: absolute;

    z-index: 5;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 100%;
}

.title-box {
    width: 470px;
    max-width: 90%;

    margin: 0 auto;

    text-align: center;
}


/* MOLOCO */

.title-box h1 {
    margin: 0;

    color: #eed29a;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 64px;
    font-weight: normal;

    line-height: 1;

    letter-spacing: 13px;

    text-shadow:
        0 2px 5px rgba(0,0,0,.85);
}


/* =========================================================
   DECORATIVE DIVIDER
========================================================= */

.title-divider {
    position: relative;

    width: 360px;
    max-width: 90%;

    height: 12px;

    margin:
        18px
        auto
        14px;
}

.title-divider::before,
.title-divider::after {
    content: "";

    position: absolute;

    top: 50%;

    width: 46%;
    height: 1px;

    background: #755724;
}

.title-divider::before {
    left: 0;
}

.title-divider::after {
    right: 0;
}

.title-divider span {
    position: relative;

    top: -3px;

    color: #d09a39;

    font-size: 9px;
}


/* =========================================================
   HERO TAGLINE
========================================================= */

.hero-tagline {
    margin: 0;

    color: #dac18e;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 13px;

    line-height: 1.35;

    letter-spacing: 3px;

    text-transform: uppercase;

    text-shadow:
        0 1px 4px rgba(0,0,0,.9);
}


/* =========================================================
   NAVIGATION
========================================================= */

.main-nav {
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #090909;

    border-bottom: 1px solid #242424;
}

.main-nav a {
    position: relative;

    height: 48px;

    display: flex;
    align-items: center;

    color: #d6a23d;

    text-decoration: none;

    text-transform: uppercase;

    font-size: 11px;

    letter-spacing: 2px;
}

.main-nav a::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 2px;

    background: #d6a23d;
}


/* =========================================================
   PAGE
========================================================= */

.page-shell {
    width: 1260px;

    max-width: calc(100% - 40px);

    margin: 0 auto;

    min-height: 900px;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.main-content {
    padding:
        32px
        0
        100px;
}


/* =========================================================
   ROOM HEADER
========================================================= */

.room-header {
    margin:
        0
        0
        22px;

    padding:
        0
        0
        22px;

    border-bottom: 1px solid #292929;
}

.room-header h2 {
    margin: 0;

    color: #ded9d1;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 31px;

    font-weight: normal;

    line-height: 1.1;
}


/* =========================================================
   DISQUS
========================================================= */

.discussion-area {
    width: 100%;

    min-height: 600px;
}

#disqus_thread {
    width: 100%;

    color-scheme: dark;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1100px) {

    .page-shell {
        width: 1080px;
    }

}


@media (max-width: 850px) {

    .hero {
        height: 230px;
    }

    .hero-left,
    .hero-right {
        width: 60%;
    }

    .title-box h1 {
        font-size: 45px;

        letter-spacing: 8px;
    }

    .title-divider {
        width: 250px;
    }

    .hero-tagline {
        font-size: 11px;

        letter-spacing: 2px;
    }

    .page-shell {
        width: calc(100% - 30px);
    }

    .room-header h2 {
        font-size: 26px;
    }

}


@media (max-width: 550px) {

    .hero {
        height: 200px;
    }

    .title-box h1 {
        font-size: 36px;

        letter-spacing: 6px;
    }

    .title-divider {
        width: 200px;

        margin-top: 15px;

        margin-bottom: 11px;
    }

    .hero-tagline {
        font-size: 9px;

        letter-spacing: 1.7px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HERO
===================================================== -->

<header class="hero">


    <!-- LEFT IMAGE -->

    <div class="hero-left"></div>


    <!-- CENTER TITLE -->

    <div class="hero-center">

        <div class="title-box">


            <h1>
                MOLOCO
            </h1>


            <div class="title-divider">

                <span>
                    ◆
                </span>

            </div>


            <p class="hero-tagline">
                SPIRIT OF THE PEOPLE
            </p>


        </div>

    </div>


    <!-- RIGHT IMAGE -->

    <div class="hero-right"></div>


</header>



<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="main-nav">

    <a href="#">
        HOME
    </a>

</nav>



<!-- =====================================================
     PAGE
===================================================== -->

<div class="page-shell">


    <main class="main-content">


        <!-- =============================================
             THE APIARY
        ============================================== -->

        <section class="room-header">

            <h2>
                The Apiary
            </h2>

        </section>



        <!-- =============================================
             REAL DISQUS
        ============================================== -->

        <section class="discussion-area">


            <div id="disqus_thread"></div>


            <script>

                /*
                 * THE APIARY
                 *
                 * Keep "the-apiary" unchanged after
                 * people begin commenting.
                 */

                var disqus_config = function () {


                    this.page.identifier =
                        'the-apiary';


                    this.page.title =
                        'The Apiary';


                    this.page.url =
                        window.location.href;


                };


                /*
                 * LOAD DISQUS
                 */

                (function () {


                    var d = document;


                    var s =
                        d.createElement('script');


                    s.src =
                        'https://disqusmoloco.disqus.com/embed.js';


                    s.setAttribute(
                        'data-timestamp',
                        +new Date()
                    );


                    (d.head || d.body)
                        .appendChild(s);


                })();


            </script>


            <noscript>

                Please enable JavaScript to view
                the comments powered by Disqus.

            </noscript>


        </section>


    </main>


</div>


</body>

</html>
