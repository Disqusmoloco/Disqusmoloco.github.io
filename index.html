<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moloco</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

html {
    background: #080808;
}

body {
    background: #080808;
    color: #d7d2cb;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   GLOBAL LINK COLOR
   Disqus can inherit this as its accent/link color
========================================================= */

a {
    color: #00d7df;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;
    width: 100%;
    height: 305px;
    overflow: hidden;

    background-image: url("moloco-banner.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center 46%;
    background-color: #03070d;

    border-bottom: 1px solid #173b72;
}


/* =========================================================
   NAVIGATION
========================================================= */

.main-nav {
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #090909;

    border-bottom: 1px solid #242424;
}

.main-nav a {
    position: relative;

    height: 48px;

    display: flex;
    align-items: center;

    /* Keep Moloco navigation gold */
    color: #4f8cff;

    text-decoration: none;
    text-transform: uppercase;

    font-size: 11px;
    letter-spacing: 2px;
}

.main-nav a::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 2px;

    background: #4f8cff;
}


/* =========================================================
   PAGE
========================================================= */

.page-shell {
    width: 100%;

    min-height: 900px;

    padding:
        0
        20px;
}


/* =========================================================
   MAIN CONTENT
========================================================= */

.main-content {
    width: 900px;
    max-width: 100%;

    margin: 0 auto;

    padding:
        34px
        0
        100px;
}


/* =========================================================
   MAIN CHATROOM HEADER
========================================================= */

.room-header {
    width: 760px;
    max-width: 100%;

    margin:
        0
        auto
        18px;

    padding:
        0
        0
        18px;

    border-bottom: 1px solid #292929;

    text-align: center;
}

.room-header h2 {
    margin: 0;

    color: #ded9d1;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 30px;

    font-weight: normal;

    line-height: 1.1;

    letter-spacing: 3px;
}


/* =========================================================
   DISCUSSION AREA
========================================================= */

.discussion-area {
    width: 100%;

    min-height: 600px;
}


/* =========================================================
   CONTAINED DISQUS
========================================================= */

.disqus-shell {
    width: 760px;
    max-width: 100%;

    margin: 0 auto;

    padding:
        22px
        26px
        30px;

    background: #0b0b0b;

    border: 1px solid #262626;

    border-radius: 5px;
}

#disqus_thread {
    width: 100%;

    color-scheme: dark;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 850px) {

    .hero {
        height: 230px;
        background-position: center 44%;
    }

    .page-shell {
        padding: 0 15px;
    }

    .main-content {
        padding-top: 28px;
    }

    .room-header h2 {
        font-size: 25px;
    }

    .disqus-shell {
        padding: 18px 18px 24px;
    }

}


@media (max-width: 550px) {

    .hero {
        height: 180px;
        background-size: auto 100%;
        background-position: center center;
    }

    .page-shell {
        padding: 0 10px;
    }

    .main-content {
        padding-top: 24px;
    }

    .room-header h2 {
        font-size: 21px;
        letter-spacing: 2px;
    }

    .disqus-shell {
        padding: 14px 12px 20px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HERO
===================================================== -->

<header class="hero" aria-label="Moloco"></header>



<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="main-nav">

    <a href="https://disqusmoloco.github.io/">
        HOME
    </a>

</nav>



<!-- =====================================================
     PAGE
===================================================== -->

<div class="page-shell">


    <main class="main-content">


        <!-- =============================================
             MAIN CHATROOM
        ============================================== -->

        <section class="room-header">

            <h2>
                ≠ MAIN CHATROOM ≠
            </h2>

        </section>



        <!-- =============================================
             DISCUSSION
        ============================================== -->

        <section class="discussion-area">


            <div class="disqus-shell">


                <!-- REAL DISQUS -->

                <div id="disqus_thread"></div>


                <script>

                    /*
                     * MAIN CHATROOM
                     */

                    var disqus_config = function () {


                        this.page.identifier =
                            'main-chatroom';


                        this.page.title =
                            'Main Chatroom';


                        this.page.url =
                            'https://disqusmoloco.github.io/';


                    };


                    /*
                     * LOAD DISQUS
                     */

                    (function () {


                        var d = document;


                        var s =
                            d.createElement('script');


                        s.src =
                            'https://disqusmoloco.disqus.com/embed.js';


                        s.setAttribute(
                            'data-timestamp',
                            +new Date()
                        );


                        (d.head || d.body)
                            .appendChild(s);


                    })();


                </script>


                <noscript>

                    Please enable JavaScript to view
                    the comments powered by Disqus.

                </noscript>


            </div>


        </section>


    </main>


</div>


</body>

</html>
